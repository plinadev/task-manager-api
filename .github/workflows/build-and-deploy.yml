name: Build and Deploy

on:
  workflow_call:
    inputs:
      env-name:
        type: string # self-hosted runner label
      github-env:
        type: string # dev or prod

jobs:
  deploy:
    runs-on: [self-hosted, '${{ inputs.env-name }}']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .env from environment variables
        run: |
          echo "APP_MESSAGE_PREFIX=${{ vars.APP_MESSAGE_PREFIX }}" >> .env
          echo "DB_HOST=${{ vars.DB_HOST }}" >> .env
          echo "DB_PORT=${{ vars.DB_PORT }}" >> .env
          echo "DB_USER=${{ vars.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_DATABASE=${{ vars.DB_DATABASE }}" >> .env
          echo "DB_SYNC=${{ vars.DB_SYNC }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "JWT_EXPIRES_IN=${{ vars.JWT_EXPIRES_IN }}" >> .env

      - name: Build Docker images
        run: docker compose build

      - name: Start Postgres and Node app
        run: docker compose up -d

      - name: Wait for Postgres to be healthy
        run: |
          echo "Waiting for Postgres..."
          until docker exec $(docker ps -qf "name=postgres") pg_isready -U postgres -d tasks; do
            sleep 2
          done
          echo "Postgres is healthy!"

      - name: Run migrations inside Node container
        run: docker exec $(docker ps -qf "name=task-manager-api") npm run migration:run
