name: Build and Deploy

on:
  workflow_call:
    inputs:
      env-name:
        type: string # self-hosted runner label
      github-env:
        type: string # dev or prod

jobs:
  deploy:
    runs-on: [self-hosted, '${{ inputs.env-name }}']
    environment: ${{ inputs.github-env }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate .env file
        run: |
          cat > .env <<EOF
          APP_MESSAGE_PREFIX=${{ vars.APP_MESSAGE_PREFIX }}
          DB_HOST=${{ vars.DB_HOST }}
          DB_PORT=${{ vars.DB_PORT }}
          DB_USER=${{ vars.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_DATABASE=${{ vars.DB_DATABASE }}
          DB_SYNC=${{ vars.DB_SYNC }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=${{ vars.JWT_EXPIRES_IN }}
          EOF

      - name: Stop existing containers
        run: docker compose down || true

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be healthy..."
          timeout 120 bash -c 'until docker compose ps | grep -q "healthy"; do echo "Waiting..."; sleep 5; done'
          echo "Services are ready!"

      - name: Show service status
        run: docker compose ps
